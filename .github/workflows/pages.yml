name: Publish FLARE 2026 to GitHub Pages

on:
  push:
    branches: [arena/7360ef95-flare-2026-official]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site (no build)
        run: |
          mkdir -p _site
          cp index.html styles.css ui-polish.css brand-experience.css profile-boing.css app.js data.js config.js profile.js _site/
          cp -R assets _site/
      - name: Verify referenced CSS and JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="([^"]+)"', html)
          missing = []
          for ref in refs:
              path = ref.split('?', 1)[0]
              if not path.endswith(('.css', '.js')) or path.startswith(('https://', 'http://', '//')):
                  continue
              if not Path('_site', path.lstrip('/')).is_file():
                  missing.append(path)
          if missing:
              raise SystemExit('Missing deployed assets: ' + ', '.join(missing))
          print('All referenced local CSS and JS files are present in the Pages artifact.')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
